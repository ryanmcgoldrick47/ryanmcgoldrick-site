<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { works: [], cv: null };
  componentDidMount() {
    fetch('content/works.json').then(r => r.json()).then(works => this.setState({ works }));
    fetch('content/cv.json').then(r => r.json()).then(cv => this.setState({ cv }));
  }
  renderVals() {
    const w = this.state.works, cv = this.state.cv || { academia: [], experience: [], awards: [] };
    let n = 0;
    const card = x => ({ name: x.title, image: x.thumb || x.images[0], href: '1c/project?item=' + x.slug, index: String(++n).padStart(2, '0'),
      meta: x.category + (x.group === 'industry' ? ' / ' + x.client.toLowerCase() : x.client ? ' / w. ' + x.client.toLowerCase() : '') });
    const studio = w.filter(x => x.group === 'studio' && x.images[0]).map(card);
    const industry = w.filter(x => x.group === 'industry' && x.images[0]).map(card);
    return { studio, industry, studioPreview: studio.slice(0, 4), academia: cv.academia, experience: cv.experience, awards: cv.awards };
  }
}
</script>
