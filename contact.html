<!DOCTYPE html>
<html>
<head>
<base href="contact-3a.dc.html">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/svg+xml" href="favicon-3a.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=DotGothic16&family=Martian+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#fff}
  a{color:oklch(16% 0 0)}
  a:hover{color:oklch(45% 0.16 320)}
</style>
<script src="./snake-3a.js"></script>
<script src="./make-3a.js"></script>
</helmet>
<div ref="{{ rootRef }}" style="position:relative;max-width:1440px;margin:0 auto;color:oklch(16% 0 0)">
  <header style="position:sticky;top:0;z-index:10;background:#fff;padding:24px clamp(20px,5vw,48px);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap">
    <a href="./" style="font-family:'Silkscreen',monospace;font-size:24px;text-decoration:none">ryan mcgoldrick</a>
    <nav style="display:flex;flex-wrap:wrap;gap:6px;font-family:'Martian Mono',monospace;font-size:12px">
      <a href="projects" style="padding:6px 11px;text-decoration:none" style-hover="background:oklch(84% 0 0)">projects</a>
      <a href="about" style="padding:6px 11px;text-decoration:none" style-hover="background:oklch(84% 0 0)">about</a>
      <a href="shop" style="padding:6px 11px;text-decoration:none" style-hover="background:oklch(84% 0 0)">shop</a>
      <a href="contact" style="background:oklch(84% 0 0);padding:6px 11px;text-decoration:none">contact</a>
    </nav>
  </header>
  <section style="padding:70px clamp(20px,5vw,48px) 50px;display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap">
    <h1 data-snake="1" style="font-family:'Silkscreen',monospace;font-weight:400;font-size:clamp(56px,10vw,140px);line-height:0.85;margin:0">contact</h1>
    
  </section>
  <section style="padding:0 clamp(20px,5vw,48px) 120px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:28px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:24px">
      <div data-snake="1" style="background:oklch(84% 0 0);padding:22px 24px;font-family:'Martian Mono',monospace;font-size:13px;line-height:1.7">for commissions, collaborations, freelance and <span style="background:oklch(78% 0.08 300);padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone">industry roles</span>. say hello.</div>
      <a data-snake="1" href="mailto:studio@ryanmcgoldrick.com" style="font-family:'DotGothic16',monospace;font-size:clamp(22px,3.2vw,40px);text-decoration:none;overflow-wrap:anywhere">studio@ryanmcgoldrick.com</a>
    </div>
    <div data-snake="1" style="border:2px solid oklch(88% 0.18 105);padding:22px 26px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 32px;font-family:'Martian Mono',monospace;font-size:12px;line-height:1.6">
      <span style="font-family:'DotGothic16',monospace;font-size:13px">email</span><a href="mailto:studio@ryanmcgoldrick.com">studio@ryanmcgoldrick.com</a>
      <span style="font-family:'DotGothic16',monospace;font-size:13px">instagram</span><a href="https://www.instagram.com/ryan__mcgoldrick">@ryan__mcgoldrick</a>
      <span style="font-family:'DotGothic16',monospace;font-size:13px">based</span><span>wollongong, nsw, australia</span>
    </div>
  </section>
  <footer style="padding:24px clamp(20px,5vw,48px) 40px;border-top:1px solid oklch(85% 0 0);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-family:'Martian Mono',monospace;font-size:11px">
    <a data-snake="1" href="mailto:studio@ryanmcgoldrick.com" style="text-decoration:none">studio@ryanmcgoldrick.com</a>
    <span>wollongong, nsw</span>
    <a href="https://www.instagram.com/ryan__mcgoldrick" style="text-decoration:none">instagram</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showSnake&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;snakeSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:420,&quot;min&quot;:100,&quot;max&quot;:1200,&quot;step&quot;:20,&quot;unit&quot;:&quot;px/s&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;snakeLength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:280,&quot;min&quot;:60,&quot;max&quot;:800,&quot;step&quot;:20,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { works: [], cv: null };
  rootRef = React.createRef();
  componentDidMount() {
    const start = () => window.Snake3A ? (this.snake = window.Snake3A(this.rootRef.current, { speed: this.props.snakeSpeed, length: this.props.snakeLength, show: this.props.showSnake })) : setTimeout(start, 50);
    start();
    fetch('content/works.json').then(r => r.json()).then(works => this.setState({ works }));
    fetch('content/cv.json').then(r => r.json()).then(cv => this.setState({ cv }));
  }
  componentWillUnmount() { this.snake && this.snake.destroy(); }
  renderVals() {
    const w = this.state.works, cv = this.state.cv || { academia: [], experience: [], awards: [] };
    let n = 0;
    const card = x => ({ name: x.title, image: x.thumb || x.images[0], href: 'project?item=' + x.slug, index: String(++n).padStart(2, '0'),
      meta: x.category + (x.group === 'industry' ? ' / for ' + x.client.toLowerCase() : x.client ? ' / w. ' + x.client.toLowerCase() : '') });
    const studio = w.filter(x => x.group === 'studio' && x.images[0]).map(card);
    const industry = w.filter(x => x.group === 'industry' && x.images[0]).map(card);
    return { rootRef: this.rootRef, studio, industry, studioPreview: studio.slice(0, 4), academia: cv.academia, experience: cv.experience, awards: cv.awards };
  }
}
</script>
</body>
</html>
