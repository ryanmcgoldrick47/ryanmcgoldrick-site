<helmet>

  body{margin:0;background:#fff}

</style>

<script src="radio-card.js"></script>

</helmet>
<div ref="{{ rootRef }}" style="position:relative;box-sizing:border-box;min-height:100vh;padding:30px;color:oklch(16% 0 0);font-family:'Martian Mono',monospace">

  <div ref="{{ wrapRef }}" style="position:relative;display:flex;flex-direction:column;background-color:#fff;background-image:linear-gradient(oklch(92% 0.02 250) 1px, transparent 1px),linear-gradient(90deg, oklch(92% 0.02 250) 1px, transparent 1px);background-size:24px 24px;border:1px solid oklch(88% 0.02 250)">

          A[axis] = Math.max(0, Math.min(LA, A[axis] - S * ov * wa)); B[axis] = Math.max(0, Math.min(LB, B[axis] + S * ov * wb));
          if (it === 0) {
            const va = this.sortVel[a], vb = this.sortVel[c], ba = base[a], bb = base[c];
            if (!fa && va[axis] * S > 0) { va[axis] = -va[axis]; ba[axis] = -S * Math.abs(ba[axis]); }
            if (!fb && vb[axis] * S < 0) { vb[axis] = -vb[axis]; bb[axis] = S * Math.abs(bb[axis]); }
          }
        }
        for (let i = 0; i < n; i++) { if (drag && drag.i === i) continue; const p = this.sortPos[i]; this.cards[i].style.transition = 'none'; this.cards[i].style.transform = `translate(${p.x}px,${p.y}px) rotate(${p.r}deg)`; }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    const rs = () => this.layoutSort(false);
    box.addEventListener('pointerover', over); box.addEventListener('pointerleave', out);
    box.addEventListener('pointerdown', down); box.addEventListener('pointermove', move); box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up); window.addEventListener('resize', rs);
    this.cleanups.push(() => { cancelAnimationFrame(raf); box.removeEventListener('pointerover', over); box.removeEventListener('pointerleave', out); box.removeEventListener('pointerdown', down); box.removeEventListener('pointermove', move); box.removeEventListener('pointerup', up); box.removeEventListener('pointercancel', up); window.removeEventListener('resize', rs); });
  }
  sortTo(by) { this.sortHold = true; clearTimeout(this.sortHoldT); this.setState({ sortBy: by }, () => { this.layoutSort(true); this.sortHoldT = setTimeout(() => { this.sortHold = false; }, 1400); }); }

  componentDidUpdate() { const el = this.featImgRef.current, lp = this.lastFeat; if (!el || !lp) return; const src = lp.images[(this.state.featI || 0) % lp.images.length]; if (el._src !== src) { el._src = src; el.style.backgroundImage = 'url("' + src + '")'; } }
  openFeat(slug) { this.featAt = performance.now(); this.setState({ feat: slug, featI: 0 }); }
  closeFeat = e => { if (e) e.stopPropagation(); if (e && performance.now() - (this.featAt || 0) < 450) return; this.setState({ feat: null }); };
  nextImg = () => { const p = this.by && this.by[this.state.feat]; if (p) this.setState(s => ({ featI: (s.featI + 1) % p.images.length })); };
  openRadio = () => { const w = window.open('radio', 'rmradio', 'width=400,height=420'); if (w) w.focus(); };
  renderVals() {
    const fp = this.state.feat && this.by ? this.by[this.state.feat] : null;
    if (fp) this.lastFeat = fp;
    const lp = this.lastFeat, fi = this.state.featI || 0;
    const feat = lp ? { src: lp.images[fi % lp.images.length], title: lp.title, num: lp.num, mat: this.mat(lp), href: this.href(lp.slug), count: (fi % lp.images.length + 1) + ' / ' + lp.images.length + (lp.images.length > 1 ? '  click for next' : '') } : { src: '', title: '', num: '', mat: '', href: '#', count: '' };
    const sortCards = this.state.ready ? this.list.map(p => { const src = p.thumb || p.images[0], alt = p.images.find(x => x !== src) || src; return { slug: p.slug, title: p.title, num: p.num, src, alt, tag: [p.category, p.client].filter(Boolean).join(' / ') }; }) : [];
    return {
      rootRef: this.rootRef, readRef: this.readRef, sortRef: this.sortRef, wrapRef: this.wrapRef, topRef: this.topRef, botRef: this.botRef, pathRef: this.pathRef, tpRef: this.tpRef,
      sortCards, sortLabels: this.state.sortLabels, feat, closeFeat: this.closeFeat, nextImg: this.nextImg, openRadio: this.openRadio,
      featImgRef: this.featImgRef, panelT: fp ? 'translateX(0)' : 'translateX(101%)', scrimOp: fp ? 1 : 0, scrimPe: fp ? 'auto' : 'none',
      sortBtns: [['all', 'everything'], ['type', 'by type'], ['client', 'by client'], ['origin', 'studio / client']].map(([k, label]) => ({ label, go: () => this.sortTo(k), style: `font-family:'Martian Mono',monospace;font-size:13px;padding:8px 12px;border:none;cursor:pointer;background:${this.state.sortBy === k ? 'oklch(78% 0.08 300)' : 'oklch(93% 0 0)'};color:oklch(16% 0 0)` })),
    };
  }
}
